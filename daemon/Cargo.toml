[package]
name = "burst-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BURST daemon — entry point, CLI, starts node + RPC + WebSocket servers"

[[bin]]
name = "burst-daemon"
path = "src/main.rs"
required-features = ["node-runtime"]

[features]
default = ["node-runtime"]
node-runtime = ["dep:burst-node"]
experimental-testnet = ["node-runtime", "burst-node/experimental-testnet"]
private-testnet = ["experimental-testnet", "burst-node/private-testnet"]

[dependencies]
burst-crypto = { workspace = true }
burst-ledger = { workspace = true }
burst-node = { workspace = true, optional = true }
burst-rpc = { workspace = true, features = ["server"] }
burst-websocket = { workspace = true, features = ["server"] }
burst-types = { workspace = true }
burst-utils = { workspace = true, features = ["logging", "runtime"] }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
