# BURST Testnet Configuration
#
# Usage:
#   burst-daemon --config testnet.toml node run
#
# Available CLI overrides are listed by `burst-daemon --help`.
# Database map capacity is configured in this TOML file.

network = "test"

# Data directory for LMDB ledger, wallets, and state.
data_dir = "./burst_data"

# Database address-space limit; default 1 GiB. Stop the node before increasing it.
# For a 4 GiB limit on a supported 64-bit host, uncomment:
# database_map_size_bytes = 4294967296
# This does not reserve 4 GiB of resident RAM or change recovery scratch limits.
# Use this same config for offline snapshot commands.

# P2P port — test network default is 17076.
port = 17076

# Maximum concurrent peer connections.
max_peers = 50

# RPC server for wallet and monitoring queries.
enable_rpc = true
rpc_port = 7077

# WebSocket server for real-time event subscriptions
# (confirmations, account updates, governance, verification).
enable_websocket = true
websocket_port = 7078

# Bootstrap peers — set the seed node's public IP here.
# Other nodes bootstrap from the seed and then discover more via keepalive.
# Example: bootstrap_peers = ["seed.burst-testnet.example.com:17076"]
bootstrap_peers = []

# Logging
log_format = "human"
log_level = "info"

# Proof-of-work validation threads.
work_threads = 1

# Expose Prometheus metrics at /metrics on the RPC port.
enable_metrics = true

# Enable test-only RPC helpers. Faucet endorses during genesis bootstrap and
# sends 1 TRST via a real burn; the recipient must explicitly receive it.
# No local balance/verification rewrites; these endpoints are denied on Live.
enable_faucet = true

# UPnP port mapping for NAT traversal.
# Automatically requests the local router to forward the P2P port.
# Disable if running on a VPS with a public IP (not needed).
enable_upnp = true

# Advertise address — optional. Node auto-detects public IP on cloud VPSes.
# Override only if auto-detect fails. Example: advertise_address = "167.172.83.88"

# Opt-in to act as a verifier in the UHV process.
enable_verification = false

# Enable voting as a representative in consensus (ORV).
# All testnet nodes vote so elections can reach quorum.
enable_representative = true
