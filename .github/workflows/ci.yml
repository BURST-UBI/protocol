name: Inspect retained Intel daemon ticket failure
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-daemon-signed-x86_64-apple-darwin
          run-id: 40876029916
          github-token: ${{ github.token }}
          path: prior-encrypted
      - name: Read original failure only, no signing or validation retry
        env:
          EVIDENCE_DECRYPT_KEY: ${{ secrets.MACOS_EVIDENCE_DECRYPT_KEY }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tempfile, pathlib, tarfile, json
          with tempfile.TemporaryDirectory() as name:
            tmp=pathlib.Path(name);key=tmp/'key.pem';key.write_text(os.environ.pop('EVIDENCE_DECRYPT_KEY'));key.chmod(0o600)
            subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in','prior-encrypted/macos-evidence.cms','-inkey',str(key),'-out',str(tmp/'evidence.tar.gz')],check=True)
            with tarfile.open(tmp/'evidence.tar.gz') as tar:
              print(tar.extractfile('macos-signing-evidence/daemon-ticket.error.log').read().decode())
              status=json.load(tar.extractfile('macos-signing-evidence/daemon.notary-info.json'))
              print('Original Apple status:',status['status'])
          PY
