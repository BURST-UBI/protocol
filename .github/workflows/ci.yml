name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        default: all
        options: [all, windows, integration, node]
        description: Full validation or isolated failure diagnosis
      integration_target:
        type: string
        default: '*'
        description: Cargo integration target; used only by manual integration runs
      node_tests:
        type: string
        default: ''
        description: Exact test names, one per line; required for manual node diagnosis

concurrency:
  group: ${{ github.workflow }}-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      windows: ${{ steps.scope.outputs.windows }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: scope
        run: node tools/ci-scope.mjs
        env:
          CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          CI_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}

  windows-installer:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Windows installer contracts
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/install-checksum.tests.ps1
        shell: pwsh
      - run: ./tools/windows-validation-run.tests.ps1
        shell: pwsh
      - name: Windows PowerShell 5.1 contracts
        shell: powershell
        run: |
          ./tools/windows-validation-run.tests.ps1
          ./tools/install-checksum.tests.ps1

  windows-service:
    needs: scope
    if: needs.scope.outputs.windows == 'true'
    name: Windows service lifecycle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-windows-tests
          cache-on-failure: true
      - run: cargo test -p burst-daemon --locked
      - run: cargo build -p burst-daemon --locked
      - run: ./tools/windows-service-smoke.ps1 -Daemon ./target/debug/burst-daemon.exe
        shell: pwsh

  spec-inventory:
    name: Specification inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test --test-concurrency=1 tools/*.test.mjs
      - run: node tools/check-spec-coverage.mjs

  wasm:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Browser wallet core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-wasm
      - run: cargo check -p burst-wallet-core -p burst-crypto --locked --target wasm32-unknown-unknown
      - run: cargo clippy -p burst-wallet-core -p burst-groups -p burst-browser --locked --target wasm32-unknown-unknown -- -D warnings

  test:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude burst-node --locked
      - name: Check Protobuf schema against the running node codec
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo test -p burst-node --test protobuf_schema --locked -- --ignored

  node-test-build:
    name: Build node test executable once
    needs: scope
    if: needs.scope.outputs.runtime == 'true' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'node')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-node-tests
          cache-on-failure: true
      - name: Compile and collect the exact test executable
        run: |
          if ! cargo test -p burst-node --lib --locked --profile validation --no-run --message-format=json > "$RUNNER_TEMP/node-build.jsonl"; then
            node --input-type=module -e '
              import {readFileSync} from "node:fs";
              for (const line of readFileSync(process.env.RUNNER_TEMP + "/node-build.jsonl", "utf8").trim().split("\n")) {
                const item = JSON.parse(line);
                if (item.reason === "compiler-message" && item.message.rendered) process.stderr.write(item.message.rendered);
              }'
            exit 1
          fi
          node --input-type=module -e '
            import {readFileSync, mkdirSync, copyFileSync} from "node:fs";
            const artifacts = readFileSync(process.env.RUNNER_TEMP + "/node-build.jsonl", "utf8")
              .trim().split("\n").map(line => JSON.parse(line))
              .filter(item => item.reason === "compiler-artifact" && item.target.name === "burst_node" && item.profile.test && item.executable);
            if (artifacts.length !== 1) throw Error("Expected one node test executable");
            mkdirSync("target/ci-node-tests", {recursive:true});
            copyFileSync(artifacts[0].executable, "target/ci-node-tests/burst-node-tests");'
          cd target/ci-node-tests
          sha256sum burst-node-tests > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: node-tests-${{ github.sha }}
          path: target/ci-node-tests
          retention-days: 3

  node-focused:
    name: Selected node regressions
    needs: node-test-build
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-tests-${{ github.sha }}
          path: target/ci-node-tests
      - name: Run exact regressions from the shared executable
        env:
          NODE_TESTS: ${{ inputs.node_tests }}
          BURST_NODE_TEST_BINARY: ${{ github.workspace }}/target/ci-node-tests/burst-node-tests
        run: |
          (cd target/ci-node-tests && sha256sum --check SHA256SUMS)
          chmod +x "$BURST_NODE_TEST_BINARY"
          [[ -n "$NODE_TESTS" ]]
          failed=0
          while IFS= read -r test; do
            [[ -n "$test" ]] || continue
            bash tools/test-node.sh focused "$test" || failed=1
          done <<< "$NODE_TESTS"
          exit "$failed"

  node-components:
    needs: [scope, node-test-build]
    if: needs.scope.outputs.runtime == 'true'
    name: Node components (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [fast, slow]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-nightly
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          name: node-tests-${{ github.sha }}
          path: target/ci-node-tests
      - name: Verify reusable executable
        run: |
          cd target/ci-node-tests
          sha256sum --check SHA256SUMS
          chmod +x burst-node-tests
      - run: bash tools/test-node.sh "${{ matrix.group }}"
        env:
          BURST_NODE_TEST_BINARY: ${{ github.workspace }}/target/ci-node-tests/burst-node-tests
      - if: matrix.group == 'fast'
        run: cargo test -p burst-node --doc --locked
      - name: Exercise snapshot operator commands
        if: matrix.group == 'fast'
        run: |
          cargo build -p burst-daemon --locked
          BURST_SNAPSHOT_DAEMON="$PWD/target/debug/burst-daemon" target/ci-node-tests/burst-node-tests confirmed_replay::tests::snapshot_export::daemon_snapshot_attest_export_verify_journey --exact --ignored --test-threads=1
          BURST_SNAPSHOT_DAEMON="$PWD/target/debug/burst-daemon" target/ci-node-tests/burst-node-tests confirmed_replay::tests::snapshot_export::framed_archive::daemon_verifies_framed_archive_beyond_legacy_header_limit --exact --ignored --test-threads=1

  node-network:
    needs: [scope, node-test-build]
    if: needs.scope.outputs.runtime == 'true'
    name: Node network (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-tests-${{ github.sha }}
          path: target/ci-node-tests
      - name: Verify reusable executable
        run: |
          cd target/ci-node-tests
          sha256sum --check SHA256SUMS
          chmod +x burst-node-tests
      - run: bash tools/test-node.sh network
        env:
          BURST_NODE_TEST_BINARY: ${{ github.workspace }}/target/ci-node-tests/burst-node-tests
          BURST_TEST_NETWORK_SHARDS: '4'
          BURST_TEST_NETWORK_SHARD: ${{ matrix.shard }}

  clippy:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --locked -- -D warnings

  fmt:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          components: rustfmt
      - run: cargo fmt --all -- --check

  health-check:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Public disposable [42; 32] fixture. Never a release founding identity.
      BURST_TEST_GENESIS_PUBLIC_KEY: 197f6b23e16c8532c6abc838facd5ea789be0c76b2920334039bfa8b3d368d61
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build daemon
        run: cargo build --locked --profile validation -p burst-daemon --features private-testnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify RPC, graceful shutdown and ledger reopen
        run: node tools/daemon-smoke.mjs ./target/validation/burst-daemon --private-testnet-fixture

  integration-test:
    needs: scope
    if: needs.scope.outputs.integration == 'true'
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: burst-nightly
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run integration tests
        env:
          INTEGRATION_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'integration' && inputs.integration_target || '*' }}
        run: |
          status=0
          cargo test -p burst-node --locked --no-fail-fast --test "$INTEGRATION_TARGET" -- --test-threads=1 || status=1
          if [[ "$INTEGRATION_TARGET" == '*' || "$INTEGRATION_TARGET" == 'confirmed_replay_network' ]]; then
            cargo test -p burst-node --locked --features experimental-testnet --test confirmed_replay_network certified_selection_catches_up_after_payment_replay -- --exact --test-threads=1 || status=1
          fi
          exit "$status"
