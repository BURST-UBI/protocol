name: Assess retained Intel daemon Gatekeeper independently
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/macos-daemon-gatekeeper.py
            /tools/validation-reuse.mjs
            /validation-inputs/evidence-recipient.pem
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-daemon-signed-x86_64-apple-darwin
          run-id: 40877414418
          github-token: ${{ github.token }}
          path: prior-encrypted
      - name: First independent assessment, no stapler retry
        timeout-minutes: 5
        env:
          EVIDENCE_DECRYPT_KEY: ${{ secrets.MACOS_EVIDENCE_DECRYPT_KEY }}
        run: python3 tools/macos-daemon-gatekeeper.py
      - name: Encrypt assessment evidence
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/macos-evidence.tar.gz" macos-daemon-gatekeeper-evidence
          openssl cms -encrypt -binary -aes-256-cbc -stream -outform DER -in "$RUNNER_TEMP/macos-evidence.tar.gz" -out macos-evidence.cms validation-inputs/evidence-recipient.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-daemon-gatekeeper-x86_64-apple-darwin
          path: macos-evidence.cms
          retention-days: 30
