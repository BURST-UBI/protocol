name: macOS candidate qualification preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: burst-macos-candidate-qualification
  cancel-in-progress: false
jobs:
  host-preflight:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect native validation prerequisites
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: python3 tools/macos-host-preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-host-preflight-${{ matrix.arch }}
          path: macos-host-evidence/
          if-no-files-found: error
          retention-days: 30
