name: Verify installed Mac wallet native creation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: burst-macos-gui-environment
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/validation/macos-candidate-20261029'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            prior: 40867797950
            daemonRun: 40845222714
            daemonArtifact: macos-candidate-aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            prior: 40868658486
            daemonRun: 40864042513
            daemonArtifact: macos-candidate-v4-x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PRIOR_RUN: ${{ matrix.prior }}
      DAEMON_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/macos-gui-environment.py
            /tools/macos-gui-prior-receipt.py
            /validation-inputs/gui-prior-driver.py
            /validation-inputs/gui-prior-actions.log
            /tools/macos-gui-environment.swift
            /tools/validation-reuse.mjs
            /validation-inputs/gui-environment-plan.json
            /validation-inputs/daemon-signing-plan.json
            /validation-inputs/evidence-recipient.pem
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-notarization-${{ matrix.target }}
          run-id: ${{ matrix.prior }}
          github-token: ${{ github.token }}
          path: prior-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-gui-environment-${{ matrix.target }}
          run-id: 40877693027
          github-token: ${{ github.token }}
          path: prior-gui-encrypted
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.daemonArtifact }}
          run-id: ${{ matrix.daemonRun }}
          github-token: ${{ github.token }}
          path: daemon-encrypted
      - name: Inspect fresh signed applications and native automation environment
        timeout-minutes: 8
        env:
          EVIDENCE_DECRYPT_KEY: ${{ secrets.MACOS_EVIDENCE_DECRYPT_KEY }}
        run: python3 tools/macos-gui-environment.py
      - name: Encrypt diagnostic evidence
        if: always()
        timeout-minutes: 3
        run: |
          test -d macos-gui-environment-evidence
          tar -czf "$RUNNER_TEMP/macos-evidence.tar.gz" macos-gui-environment-evidence
          openssl cms -encrypt -binary -aes-256-cbc -stream -outform DER -in "$RUNNER_TEMP/macos-evidence.tar.gz" -out macos-evidence.cms validation-inputs/evidence-recipient.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-gui-environment-${{ matrix.target }}
          path: macos-evidence.cms
          if-no-files-found: error
          retention-days: 30
