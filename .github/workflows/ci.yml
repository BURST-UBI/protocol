name: Diagnose Mac GUI probe compiler failure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/macos-gui-environment.swift
      - name: Capture exact probe compiler diagnostic without launching apps
        timeout-minutes: 3
        run: xcrun swiftc -j 1 tools/macos-gui-environment.swift -o "$RUNNER_TEMP/probe"
