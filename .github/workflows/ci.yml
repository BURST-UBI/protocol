name: macOS frozen desktop native qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: burst-macos-candidate-qualification
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 140
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-11
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      TOKIO_WORKER_THREADS: 1
      RAYON_NUM_THREADS: 1
      BURST_TEST_CPUS: 1
      BURST_TEST_GENESIS_PUBLIC_KEY: 948acade65c53fcc5e0d2d001fb1b01edc40b9ea102f1a9ae84d53c92551fd7e
      MACOS_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /tools/
            /validation-inputs/
      - name: Restore stable target and dependency cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .macos-target
          key: burst-macos-${{ matrix.target }}-nightly20261011-${{ hashFiles('validation-inputs/source.tar.gz') }}-desktop-native-v2
          restore-keys: burst-macos-${{ matrix.target }}-nightly20261011-${{ hashFiles('validation-inputs/source.tar.gz') }}-desktop-native-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
          targets: ${{ matrix.target }}
      - name: Verify frozen source and host
        run: python3 tools/macos-candidate-v2.py prepare
      - name: Verify frozen desktop inputs
        run: python3 tools/macos-desktop-native-retry.py prepare
      - name: Retrieve latest failed frontend evidence
        uses: actions/download-artifact@v4
        with:
          name: macos-desktop-native-${{ matrix.target }}
          path: prior-encrypted
          run-id: 40851484159
          github-token: ${{ github.token }}
      - name: Restore original frontend receipt chain
        env:
          EVIDENCE_DECRYPT_KEY: ${{ secrets.MACOS_EVIDENCE_DECRYPT_KEY }}
        run: python3 tools/macos-restore-native-evidence.py
      - name: Restore installed wallet tooling
        uses: actions/cache/restore@v4
        with:
          path: |
            desktop-source/wallet/node_modules
            desktop-source/node-gui/node_modules
          key: burst-macos-${{ matrix.target }}-desktop-npm-${{ hashFiles('validation-inputs/desktop-source.tar.gz') }}-v1
          fail-on-cache-miss: true
      - name: wallet native
        run: python3 tools/macos-desktop-native-retry.py wallet native
      - name: node-gui dependencies
        run: python3 tools/macos-desktop-native-retry.py node-gui dependencies
      - name: node-gui frontend
        run: python3 tools/macos-desktop-native-retry.py node-gui frontend
      - name: node-gui native
        run: python3 tools/macos-desktop-native-retry.py node-gui native
      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .macos-target
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Preserve installed Tauri tooling for packaging
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            desktop-source/wallet/node_modules
            desktop-source/node-gui/node_modules
          key: burst-macos-${{ matrix.target }}-desktop-npm-${{ hashFiles('validation-inputs/desktop-source.tar.gz') }}-v2
      - name: Encrypt retained evidence for local review
        if: always()
        timeout-minutes: 5
        run: |
          test -d macos-desktop-native-retry-evidence
          tar -czf "$RUNNER_TEMP/macos-evidence.tar.gz" macos-desktop-native-retry-evidence
          openssl cms -encrypt -binary -aes-256-cbc -stream -outform DER -in "$RUNNER_TEMP/macos-evidence.tar.gz" -out macos-evidence.cms validation-inputs/evidence-recipient.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-desktop-native-retry-${{ matrix.target }}
          path: macos-evidence.cms
          if-no-files-found: error
          retention-days: 30
