name: Documentation website
on:
  pull_request:
    paths: ['docs/**', 'website/**', 'types/**', 'governance/**', 'tools/documentation-defaults*', 'Cargo.lock', 'vercel.json', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'website/**', 'types/**', 'governance/**', 'tools/documentation-defaults*', 'Cargo.lock', 'vercel.json', '.github/workflows/website.yml']
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-11
      - uses: Swatinem/rust-cache@v2
      - run: node tools/documentation-defaults.mjs --verify
      - run: node --test tools/documentation-defaults.test.mjs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
