[package]
name = "burst-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser timers and bounded, credential-free HTTP for BURST clients"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["AbortController", "AbortSignal", "Headers", "Request", "RequestInit", "RequestCache", "RequestCredentials", "RequestMode", "RequestRedirect", "Response", "ReadableStream", "ReadableStreamDefaultReader"] }
futures-util = { workspace = true }
thiserror = { workspace = true }
