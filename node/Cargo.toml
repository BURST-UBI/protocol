[package]
autotests = false
name = "burst-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "BURST full node — orchestrates all protocol engines"

[features]
experimental-testnet = ["burst-verification/experimental-testnet"]
private-testnet = ["experimental-testnet"]

[dependencies]
burst-utils = { workspace = true, features = ["runtime"] }
blake2 = { workspace = true }
burst-types = { workspace = true }
burst-crypto = { workspace = true }
burst-brn = { workspace = true }
burst-trst = { workspace = true }
burst-transactions = { workspace = true }
burst-store = { workspace = true }
burst-store-lmdb = { workspace = true }
burst-ledger = { workspace = true }
burst-verification = { workspace = true }
burst-vrf = { workspace = true }
burst-consensus = { workspace = true }
burst-work = { workspace = true }
burst-governance = { workspace = true }
burst-consti = { workspace = true }
burst-messages = { workspace = true }
burst-network = { workspace = true }
rand = { workspace = true }
burst-rpc = { workspace = true }
burst-websocket = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
ciborium = "0.2.2"
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
prometheus = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
burst-daemon = { path = "../daemon", default-features = false }
tracing-subscriber = { workspace = true }
burst-nullables = { workspace = true }
heed = { workspace = true }
bincode = { workspace = true }
proptest = { workspace = true }
burst-wallet-core = { workspace = true }

[[test]]
name = "bootstrap_exit_network"
path = "tests/network/bootstrap_exit.rs"

[[test]]
name = "confirmation_recovery"
path = "tests/recovery/confirmation_recovery.rs"

[[test]]
name = "confirmed_authority_network"
path = "tests/network/confirmed_authority.rs"

[[test]]
name = "confirmed_replay_network"
path = "tests/network/confirmed_replay.rs"

[[test]]
name = "economic_snapshot_recovery"
path = "tests/recovery/economic_snapshot_recovery.rs"

[[test]]
name = "fork_replacement"
path = "tests/network/fork_replacement.rs"

[[test]]
name = "fuzz_serialization"
path = "tests/serialization/main.rs"

[[test]]
name = "governance_network"
path = "tests/network/governance.rs"

[[test]]
name = "integration_tests"
path = "tests/components/main.rs"

[[test]]
name = "merge_fork_network"
path = "tests/network/merge_fork.rs"

[[test]]
name = "outcome_release_gate"
path = "tests/recovery/outcome_release_gate.rs"

[[test]]
name = "outcome_restart"
path = "tests/recovery/outcome_restart.rs"

[[test]]
name = "parallel_authentication_network"
path = "tests/network/parallel_authentication.rs"

[[test]]
name = "payment_epoch_network"
path = "tests/network/payment_epoch.rs"
