[package]
name = "burst-wallet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wallet core library — key management, BRN display, TRST portfolio, tx building, delegation"

[features]
browser-test = []

[[example]]
name = "browser_check"
crate-type = ["cdylib"]
required-features = ["browser-test"]

[dependencies]
burst-types = { workspace = true }
burst-crypto = { workspace = true }
burst-brn = { workspace = true }
burst-transactions = { workspace = true }
burst-ledger = { workspace = true }
burst-work = { workspace = true }
burst-governance = { workspace = true }
burst-groups = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
x25519-dalek = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
burst-browser = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
